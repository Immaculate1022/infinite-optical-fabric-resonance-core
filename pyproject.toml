[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infinite-optical-fabric"
version = "0.1.0"
description = "Open conceptual photonic computing architecture: 5D Penteract + φ-scaled Kuramoto Resonance Core"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-4.0"}
authors = [
  {name = "Immaculate1022 (Gregory Scott Davis)"}
]
keywords = ["photonic", "kuramoto", "hypercube", "penteract", "golden-ratio", "synchronization", "open-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "networkx>=3.0",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Immaculate1022/infinite-optical-fabric-resonance-core"
Repository = "https://github.com/Immaculate1022/infinite-optical-fabric-resonance-core"

[tool.setuptools.packages.find]
where = ["."]
include = ["iof*"]
